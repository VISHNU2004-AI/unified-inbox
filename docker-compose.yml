version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unified_inbox_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unified_inbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: unified_inbox_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/unified_inbox?schema=public"
      JWT_SECRET: "unified_inbox_jwt_super_secret_key_prod"
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:5000/ws"

volumes:
  postgres_data:
